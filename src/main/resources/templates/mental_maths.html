<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FinTrack • Mental Math</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<style>

:root{
--primary:#6750A4;
--background:#F4EFFA;
--surface:#fff;
--outline:#CAC4D0;
--success:#2E7D32;
--danger:#B3261E;
--warning:#F9A825;
--shadow:rgba(0,0,0,.14);
}

*{box-sizing:border-box;font-family:Roboto}

body{
margin:0;
background:linear-gradient(135deg,#EADDFF,#F6EDFF);
padding:14px;
}

.layout{
display:grid;
grid-template-columns:280px 1fr;
gap:16px;
max-width:1600px;
margin:auto;
height:calc(100vh - 28px);
}

.card{
background:var(--surface);
border-radius:22px;
box-shadow:0 10px 30px var(--shadow);
padding:16px;
display:flex;
flex-direction:column;
}

/* LEFT PANEL */

.sidebar-scroll{
overflow:auto;
flex:1;
}

.level-item{
padding:10px;
border-radius:12px;
background:var(--background);
margin-bottom:6px;
display:flex;
justify-content:space-between;
font-size:14px;
}

.total-score{
margin-top:10px;
padding:10px;
border-radius:12px;
background:var(--primary);
color:white;
font-weight:600;
display:flex;
justify-content:space-between;
}

.pack-type{
margin-top:6px;
font-size:13px;
opacity:.8;
}

/* LEADERBOARD */

.leaderboard{
margin-top:20px;
}

.leaderboard-scroll{
max-height:350px;
overflow-y:auto;
border:1px solid var(--outline);
border-radius:12px;
}

.leaderboard-item{
display:flex;
justify-content:space-between;
padding:8px 10px;
border-bottom:1px solid var(--outline);
font-size:14px;
}

/* RIGHT PANEL */

.header{
display:flex;
justify-content:space-between;
align-items:center;
}

.settings{
display:flex;
gap:10px;
}

select,input{
padding:10px;
border-radius:10px;
border:1px solid var(--outline);
}

button{
background:var(--primary);
color:white;
border:none;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
}

.game-area{
margin-top:20px;
flex:1;
display:flex;
flex-direction:column;
}

/* QUESTION HEADER */

.question-header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:20px;
}

.question{
font-size:30px;
font-weight:600;
flex:1;
}

.divider{
width:2px;
height:40px;
background:var(--outline);
margin:0 20px;
}

.timer{
font-size:22px;
font-weight:700;
min-width:80px;
text-align:center;
}

.green{color:var(--success)}
.yellow{color:var(--warning)}
.red{color:var(--danger)}

.progress{
margin-top:10px;
font-size:16px;
font-weight:500;
}

.answer-box{
display:flex;
gap:10px;
margin-top:20px;
}

.results{
margin-top:20px;
padding:14px;
background:var(--background);
border-radius:14px;
}

@media(max-width:900px){
.layout{grid-template-columns:1fr}
}

</style>
</head>

<body>

<div class="layout">

<!-- LEFT PANEL -->

<div class="card">

<h3>Your Scores</h3>

<div class="sidebar-scroll">

<div class="level-item"><span>Level 1</span><span id="score1">0</span></div>
<div class="level-item"><span>Level 2</span><span id="score2">0</span></div>
<div class="level-item"><span>Level 3</span><span id="score3">0</span></div>
<div class="level-item"><span>Level 4</span><span id="score4">0</span></div>

<div class="total-score">
<span>Total Score</span>
<span id="totalScore">0</span>
</div>

<div class="pack-type">
Pack Type : <span id="packType">-</span>
</div>

</div>

<div class="leaderboard">

<h3>Leaderboard (Top 15)</h3>

<div class="leaderboard-scroll" id="leaderboardList"></div>

</div>

</div>

<!-- RIGHT PANEL -->

<div class="card">

<div class="header">

<h2>Mental Math Trainer</h2>

<div class="settings">

<select id="levelSelect">
<option value="1">Level 1</option>
<option value="2">Level 2</option>
<option value="3">Level 3</option>
<option value="4">Level 4</option>
</select>

<select id="questionCount">
<option value="10">10 Questions</option>
<option value="15">15 Questions</option>
<option value="20">20 Questions</option>
</select>

<button onclick="startGame()">Start</button>

</div>

</div>

<div class="game-area">

<div class="question-header">

<div class="question" id="questionText">Press Start</div>

<div class="divider"></div>

<div class="timer green" id="timer">0s</div>

</div>

<div class="progress">
Question <span id="currentQ">0</span> / <span id="totalQ">0</span>
</div>

<div class="answer-box">

<input type="number" id="answerInput" placeholder="Your answer">

<button onclick="submitAnswer()">Submit</button>

</div>

<div class="results" id="resultsBox" style="display:none"></div>

</div>

</div>

</div>

<script>

/* Leaderboard Demo */

const leaderboard=[
{name:"Alex",score:920,pack:"Long"},
{name:"Ravi",score:870,pack:"Medium"},
{name:"Maria",score:830,pack:"Small"},
{name:"John",score:790,pack:"Long"},
{name:"Aisha",score:750,pack:"Medium"},
{name:"Karan",score:720,pack:"Small"},
{name:"Nina",score:690,pack:"Medium"},
{name:"Leo",score:660,pack:"Long"},
{name:"Sam",score:640,pack:"Small"},
{name:"Priya",score:610,pack:"Medium"},
{name:"David",score:600,pack:"Long"},
{name:"Isha",score:590,pack:"Small"},
{name:"Tina",score:560,pack:"Medium"},
{name:"Raj",score:540,pack:"Long"},
{name:"Ali",score:520,pack:"Small"}
]

leaderboard.forEach((p,i)=>{
let row=document.createElement("div")
row.className="leaderboard-item"
row.innerHTML=`<span>${i+1}. ${p.name}</span><span>${p.score} (${p.pack})</span>`
leaderboardList.appendChild(row)
})

let questions=[]
let current=0
let score=0
let timer=0
let interval
let multiplier=1
let pack="Small"

/* Question Generator */

function generateQuestion(level){

let type=Math.floor(Math.random()*5)

let q,a

if(type===0){
let x=Math.floor(Math.random()*50*level)
let y=Math.floor(Math.random()*50*level)
q=`${x} + ${y}`
a=x+y
}

if(type===1){
let x=Math.floor(Math.random()*100*level)
let y=Math.floor(Math.random()*50*level)
q=`${x} - ${y}`
a=x-y
}

if(type===2){
let x=Math.floor(Math.random()*10)+level*2
let y=Math.floor(Math.random()*10)+level
q=`${x} × ${y}`
a=x*y
}

if(type===3){
let y=Math.floor(Math.random()*9)+2
let a1=Math.floor(Math.random()*20)+level*5
let x=y*a1
q=`${x} ÷ ${y}`
a=a1
}

if(type===4){
let percent=[10,15,20,25,30][Math.floor(Math.random()*5)]
let base=Math.floor(Math.random()*200)+50
q=`${percent}% of ${base}`
a=(percent/100)*base
}

return {q,a}

}

function startGame(){

let level=parseInt(levelSelect.value)
let count=parseInt(questionCount.value)

questions=[]
current=0
score=0

if(count===10){multiplier=1;pack="Small"}
if(count===15){multiplier=1.3;pack="Medium"}
if(count===20){multiplier=1.6;pack="Long"}

packType.innerText=pack

for(let i=0;i<count;i++){
questions.push(generateQuestion(level))
}

totalQ.innerText=count

showQuestion()

}

function showQuestion(){

if(current>=questions.length){
finishGame()
return
}

questionText.innerText=questions[current].q
currentQ.innerText=current+1
answerInput.value=""

startTimer()

}

function startTimer(){

clearInterval(interval)

let level=parseInt(levelSelect.value)

let timers=[6,8,10,12]

timer=timers[level-1]

updateTimer()

interval=setInterval(()=>{

timer--

updateTimer()

if(timer<=0){
clearInterval(interval)
nextQuestion()
}

},1000)

}

function updateTimer(){

let el=document.getElementById("timer")

el.innerText=timer+"s"

let level=parseInt(levelSelect.value)
let max=[8,10,12,14][level-1]

let ratio=timer/max

el.classList.remove("green","yellow","red")

if(ratio>.6) el.classList.add("green")
else if(ratio>.3) el.classList.add("yellow")
else el.classList.add("red")

}

function submitAnswer(){

let val=parseFloat(answerInput.value)

if(val===questions[current].a){
score++
}

nextQuestion()

}

function nextQuestion(){
current++
showQuestion()
}

function finishGame(){

let level=parseInt(levelSelect.value)

let finalScore=Math.round(score*multiplier*10)

document.getElementById("score"+level).innerText=
parseInt(document.getElementById("score"+level).innerText)+finalScore

let total=
parseInt(score1.innerText)+
parseInt(score2.innerText)+
parseInt(score3.innerText)+
parseInt(score4.innerText)

totalScore.innerText=total

resultsBox.style.display="block"

resultsBox.innerHTML=`
<h3>Results</h3>
Correct : ${score}/${questions.length}<br>
Pack : ${pack}<br>
Score Earned : ${finalScore}
`

}

</script>

</body>
</html>
