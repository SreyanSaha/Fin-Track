<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FinTrack • Reset Password</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>

:root{
--primary:#6750A4;
--on-primary:#FFFFFF;
--background:#F4EFFA;
--surface:#FFFFFF;
--error:#B3261E;
--outline:#CAC4D0;
--text-primary:#1C1B1F;
--text-secondary:#49454F;
--shadow:rgba(0,0,0,0.12);
}

*{
box-sizing:border-box;
font-family:"Roboto",sans-serif;
}

body{
margin:0;
min-height:100vh;
background:linear-gradient(135deg,#EADDFF,#F6EDFF);
display:flex;
align-items:center;
justify-content:center;
padding:16px;
}

.app-container{
width:100%;
max-width:420px;
background:var(--surface);
border-radius:28px;
box-shadow:0 10px 30px var(--shadow);
padding:32px 24px;
animation:fadeIn .6s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(12px)}
to{opacity:1;transform:translateY(0)}
}

.app-title{
text-align:center;
margin-bottom:24px;
}

.app-title h1{
margin:0;
font-size:28px;
font-weight:700;
color:var(--primary);
}

/* Fields */

.field{
position:relative;
margin-bottom:20px;
}

.field input{
width:100%;
padding:16px 12px;
border-radius:12px;
border:1px solid var(--outline);
font-size:16px;
outline:none;
}

.field label{
position:absolute;
left:12px;
top:50%;
transform:translateY(-50%);
background:var(--surface);
padding:0 6px;
font-size:14px;
color:var(--text-secondary);
transition:.2s;
}

.field input:focus+label,
.field input:not(:placeholder-shown)+label{
top:-6px;
font-size:12px;
color:var(--primary);
}

.btn{
width:100%;
padding:14px;
border-radius:14px;
border:none;
background:var(--primary);
color:var(--on-primary);
font-size:16px;
cursor:pointer;
}

.btn:hover{
opacity:.95;
}

/* Sections */

.otp-section{
display:none;
margin-top:18px;
animation:fadeIn .4s ease;
}

.reset-section{
display:none;
margin-top:18px;
animation:fadeIn .4s ease;
}

.timer{
text-align:center;
font-size:14px;
color:var(--text-secondary);
margin-bottom:12px;
}

/* Alerts */

.response-box{
width:100%;
margin-top:10px;
}

.msg{
padding:10px 15px;
border-radius:6px;
font-size:14px;
display:none;
animation:fadeIn .4s ease;
}

.success{
background:#d4f8d4;
color:#166f16;
border-left:4px solid #1ea21e;
}

.error{
background:#ffe0e0;
color:#a10000;
border-left:4px solid #d10000;
}

.loading{
background:#fff3cd;
color:#856404;
border-left:4px solid #ff7a00;
display:none;
}

.switch{
margin-top:18px;
text-align:center;
color:#6750A4;
}

.switch span{
color:black;
cursor:pointer;
}

</style>
</head>

<body>

<div class="app-container">

<div class="app-title">
<h1>FinTrack</h1>
</div>

<!-- EMAIL INPUT -->

<div id="emailSection">

<div class="response-box">
<p id="emailSuccess" class="msg success"></p>
<p id="emailError" class="msg error"></p>
<p id="emailLoading" class="msg loading">Processing request…</p>
</div>

<div class="field">
<input type="email" id="resetEmail" placeholder=" ">
<label>Registered Email</label>
</div>

<button class="btn" onclick="sendOTP()">Send OTP</button>

</div>

<!-- OTP SECTION -->

<div class="otp-section" id="otpSection">

<p style="text-align:center;color:black;">
Enter the OTP sent to your email
</p>

<div class="timer" id="timer">Time left: 60s</div>

<div class="response-box">
<p id="otpSuccess" class="msg success"></p>
<p id="otpError" class="msg error"></p>
<p id="otpLoading" class="msg loading">Processing request…</p>
</div>

<div class="field">
<input type="text" id="otpInput" maxlength="6" placeholder=" ">
<label>Enter OTP</label>
</div>

<button class="btn" onclick="verifyOTP()">Verify OTP</button>

<div class="switch">
Didn't receive OTP? <span onclick="resendOTP()">Resend</span>
</div>

</div>

<!-- RESET PASSWORD -->

<div class="reset-section" id="resetSection">

<div class="response-box">
<p id="resetSuccess" class="msg success"></p>
<p id="resetError" class="msg error"></p>
<p id="resetLoading" class="msg loading">Processing request…</p>
</div>

<div class="field">
<input type="password" id="newPassword" placeholder=" ">
<label>New Password</label>
</div>

<div class="field">
<input type="password" id="confirmPassword" placeholder=" ">
<label>Confirm Password</label>
</div>

<button class="btn" onclick="resetPassword()">Reset Password</button>

</div>

</div>

<script>

/* TIMER */

let time=60
let timerInterval

function startTimer(){

time=60

timerInterval=setInterval(()=>{

time--

document.getElementById("timer").innerText="Time left: "+time+"s"

if(time<=0){
clearInterval(timerInterval)
}

},1000)

}

/* SEND OTP */

function sendOTP(){

const email=document.getElementById("resetEmail").value.trim()

if(!email){
showMsg("emailError","Please enter your registered email")
return
}

document.getElementById("otpSection").style.display="block"

startTimer()

showMsg("emailSuccess","OTP sent to your email")

/* Backend example

axios.post("/send-reset-otp",{email})

*/

}

/* VERIFY OTP */

function verifyOTP(){

const otp=document.getElementById("otpInput").value.trim()

if(otp.length!==6){
showMsg("otpError","Enter valid OTP")
return
}

showMsg("otpSuccess","OTP verified")

document.getElementById("resetSection").style.display="block"

/* Backend example

axios.post("/verify-reset-otp",{otp})

*/

}

/* RESET PASSWORD */

function resetPassword(){

const pass=document.getElementById("newPassword").value
const confirm=document.getElementById("confirmPassword").value

if(pass.length<6){
showMsg("resetError","Password must be at least 6 characters")
return
}

if(pass!==confirm){
showMsg("resetError","Passwords do not match")
return
}

showMsg("resetSuccess","Password reset successful")

/* Backend example

axios.post("/reset-password",{
password:pass
})

*/

}

/* RESEND OTP */

function resendOTP(){

startTimer()

showMsg("otpSuccess","OTP resent")

}

/* MESSAGE SYSTEM */

function showMsg(id,text){

let el=document.getElementById(id)

el.innerText=text
el.style.display="block"

setTimeout(()=>{
el.style.display="none"
},3000)

}

</script>

</body>
</html>
