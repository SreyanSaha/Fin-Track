<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FinTrack • Reset Password</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>

:root{
--primary:#6750A4;
--background:#F4EFFA;
--surface:#FFFFFF;
--error:#B3261E;
--outline:#CAC4D0;
--text-secondary:#49454F;
--shadow:rgba(0,0,0,0.12);
}

*{box-sizing:border-box;font-family:"Roboto",sans-serif}

body{
margin:0;
min-height:100vh;
background:linear-gradient(135deg,#EADDFF,#F6EDFF);
display:flex;
align-items:center;
justify-content:center;
padding:16px;
}

.app-container{
width:100%;
max-width:420px;
background:var(--surface);
border-radius:28px;
box-shadow:0 10px 30px var(--shadow);
padding:30px 24px;
animation:fadeIn .5s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px)}
to{opacity:1;transform:translateY(0)}
}

h1{
text-align:center;
color:var(--primary);
margin-bottom:8px;
}

.subtitle{
text-align:center;
font-size:14px;
color:var(--text-secondary);
margin-bottom:22px;
}

/* STEP TITLE */

.step-title{
font-size:14px;
font-weight:600;
margin-bottom:10px;
color:var(--primary);
}

/* FIELD */

.field{
position:relative;
margin-bottom:18px;
}

.field input{
width:100%;
padding:14px 12px;
border-radius:12px;
border:1px solid var(--outline);
font-size:15px;
}

.field label{
position:absolute;
left:12px;
top:50%;
transform:translateY(-50%);
background:white;
padding:0 6px;
font-size:13px;
color:var(--text-secondary);
transition:.2s;
}

.field input:focus+label,
.field input:not(:placeholder-shown)+label{
top:-6px;
font-size:11px;
color:var(--primary);
}

/* BUTTON */

.btn{
width:100%;
padding:14px;
border-radius:14px;
border:none;
background:var(--primary);
color:white;
font-size:15px;
cursor:pointer;
}

.btn:hover{opacity:.95}

/* OTP */

.otp-box{
text-align:center;
margin-bottom:16px;
}

.otp-input{
width:100%;
text-align:center;
font-size:22px;
letter-spacing:6px;
padding:12px;
border-radius:12px;
border:1px solid var(--outline);
}

/* TIMER */

.timer{
text-align:center;
font-size:13px;
color:var(--text-secondary);
margin-bottom:10px;
}

/* PASSWORD TOGGLE */

.password-wrapper{
position:relative;
}

.toggle{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
font-size:13px;
color:var(--primary);
}


.response-box {
        width: 100%;
        margin-top: 15px;
    }

    .msg {
        padding: 10px 15px;
        border-radius: 6px;
        font-size: 14px;
        display: none;    /* Hidden by default */
        animation: fadeIn 0.4s ease;
    }

    /* SUCCESS MESSAGE */
    .success {
        background: #d4f8d4;
        color: #166f16;
        border-left: 4px solid #1ea21e;
    }

    /* ERROR MESSAGE */
    .error {
        background: #ffe0e0;
        color: #a10000;
        border-left: 4px solid #d10000;
    }

    .loading {
        background: #fff3cd;              /* light yellow background */
        color: #856404;                   /* dark yellow-brown text */
        border-left: 4px solid #ff7a00;   /* orange theme border */
        padding: 10px 15px;
        border-radius: 6px;
        font-size: 14px;
        display: none;                    /* hidden until needed */
    }
    .hidden {
        display: none;
    }
/* SECTIONS */

.section{
display:none;
animation:fadeIn .4s ease;
}

/* ACTIVE STEP */

.active{
display:block;
}

.switch{
text-align:center;
font-size:13px;
margin-top:12px;
}

.switch span{
color:var(--primary);
cursor:pointer;
}

</style>
</head>

<body>

<div class="app-container">

<h1>FinTrack</h1>
<p class="subtitle">Reset your password securely</p>

<!-- STEP 1 -->
<div id="step1" class="section active">

<div class="step-title">Step 1: Verify Email</div>

<div class="response-box">
    <p id="forgetPassEmailSuccessMsg" class="msg success"></p>
    <p id="forgetPassEmailErrorMsg" class="msg error"></p>
    <p id="forgetPassEmailLoadingMsg" class="msg loading">Processing request…</p>
</div>

<div class="field">
<input type="email" id="resetEmail" placeholder=" ">
<label>Registered Email</label>
</div>

<button class="btn" onclick="checkEmailInput()">Send OTP</button>

</div>

<!-- STEP 2 -->
<div id="step2" class="section">

<div class="step-title">Step 2: Enter OTP</div>

<div class="response-box">
    <p id="forgetPassOtpSuccessMsg" class="msg success"></p>
    <p id="forgetPassOtpErrorMsg" class="msg error"></p>
    <p id="forgetPassOtpLoadingMsg" class="msg loading">Processing request…</p>
</div>

<div class="timer" id="timer">Time left: 60s</div>

<div class="otp-box">
<input class="otp-input" type="text" maxlength="6" id="otpInput" placeholder="••••••">
</div>

<button class="btn" onclick="verifyOTP()">Verify OTP</button>

<div class="switch">
Didn't receive OTP? <span onclick="resendOTP()">Resend</span>
</div>

</div>

<!-- STEP 3 -->
<div id="step3" class="section">

<div class="response-box">
    <p id="forgetPassNewPassSuccessMsg" class="msg success"></p>
    <p id="forgetPassNewPassErrorMsg" class="msg error"></p>
    <p id="forgetPassNewPassLoadingMsg" class="msg loading">Processing request…</p>
</div>

<div class="step-title">Step 3: Set New Password</div>

<div class="field password-wrapper">
<input type="password" id="newPassword" placeholder=" ">
<label>New Password</label>
<span class="toggle" onclick="togglePass('newPassword')">Show</span>
</div>

<div class="field password-wrapper">
<input type="password" id="confirmPassword" placeholder=" ">
<label>Confirm Password</label>
<span class="toggle" onclick="togglePass('confirmPassword')">Show</span>
</div>

<button class="btn" onclick="resetPassword()">Reset Password</button>

</div>

</div>

<script>

function checkEmailInput(){
    const success = document.getElementById("forgetPassEmailSuccessMsg");
    const error = document.getElementById("forgetPassEmailErrorMsg");

    if(document.getElementById("resetEmail").value.trim()===""){
        success.style.display = "none";
        error.style.display = "block";
        error.textContent = "Fields cannot be empty.";
    }else getOtp();
}

let email="";

const getOtp = async ()=>{
    document.getElementById("forgetPassOtpSuccessMsg").style.display   = "none";
    document.getElementById("forgetPassOtpErrorMsg").style.display     = "none";
    document.getElementById("forgetPassEmailLoadingMsg").style.display = "block";

    email=document.getElementById("resetEmail").value;
    
    try{
        const response = await axios.post('/auth/forget-password',
        {
            "email": email,
        },{
            headers:{
                "Content-Type": "application/json"
            }
        });
        if(response.status===200 && response.data.status===true){
            document.getElementById("forgetPassEmailLoadingMsg").style.display = "none";
            document.getElementById("forgetPassOtpSuccessMsg").style.display   = "block";
            document.getElementById("forgetPassOtpErrorMsg").style.display     = "none";
            document.getElementById("forgetPassOtpLoadingMsg").style.display   = "none";
            document.getElementById("forgetPassOtpSuccessMsg").textContent     = response.data.msg;
            startTimer();
            goTo("step2");
        }else if(response.status===200 && response.data.status===false){
            document.getElementById("forgetPassEmailLoadingMsg").style.display = "none";
            document.getElementById("forgetPassOtpSuccessMsg").style.display   = "none";
            document.getElementById("forgetPassOtpErrorMsg").style.display     = "none";
            document.getElementById("forgetPassOtpLoadingMsg").style.display   = "none";
            document.getElementById("forgetPassEmailErrorMsg").style.display   = "block";
            document.getElementById("forgetPassEmailErrorMsg").textContent     = response.data.msg;
        }
    }catch(exception){
        console.log(exception);
    }

};

/* STEP SWITCH */
function goTo(step){
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'))
    document.getElementById(step).classList.add('active')
}

/* TIMER */
function startTimer(){
    let time = 60, interval;
    clearInterval(interval);
    interval=setInterval(()=>{
        time--;
        document.getElementById("timer").innerText = "Time left: "+time+"s";
        if(time<=0) clearInterval(interval)
    },1000);
}


const verifyOTP = async ()=>{
    const otp=document.getElementById("otpInput").value.trim()
    if(otp.length!==6){
        document.getElementById("forgetPassOtpSuccessMsg").style.display = "none";
        document.getElementById("forgetPassOtpErrorMsg").style.display   = "block";
        document.getElementById("forgetPassOtpLoadingMsg").style.display = "none";
        document.getElementById("forgetPassOtpErrorMsg").textContent   = "Enter a valid 6-digit OTP.";
        return;
    }

    document.getElementById("forgetPassOtpSuccessMsg").style.display = "none";
    document.getElementById("forgetPassOtpErrorMsg").style.display   = "none";
    document.getElementById("forgetPassOtpLoadingMsg").style.display = "block";

    try{
        const response = await axios.post('/auth/forget-password/otp',
        {
            "otp": document.getElementById("otpInput").value,
            "email": email,
        },{
            headers:{
                "Content-Type": "application/json"
            }
        });
        if(response.status===200 && response.data.status===true){
            document.getElementById("forgetPassOtpErrorMsg").style.display   = "none";
            document.getElementById("forgetPassOtpLoadingMsg").style.display = "none";
            document.getElementById("forgetPassOtpSuccessMsg").style.display = "block";
            document.getElementById("forgetPassOtpSuccessMsg").textContent   = response.data.msg;
            setTimeout(()=>{
                goTo("step3");
            }, 1800);
        }else if(response.status===200 && response.data.status===false){
            document.getElementById("forgetPassOtpSuccessMsg").style.display = "none";
            document.getElementById("forgetPassOtpErrorMsg").style.display   = "block";
            document.getElementById("forgetPassOtpLoadingMsg").style.display = "none";
            document.getElementById("forgetPassOtpErrorMsg").textContent   = response.data.msg;
        }
    }catch(exception){
        console.log(exception);
    }
};

/* RESET */
function resetPassword(){
    const p=document.getElementById("newPassword").value
    const c=document.getElementById("confirmPassword").value

    if(p.trim()==="" && c.trim()===""){
        document.getElementById("forgetPassNewPassSuccessMsg").style.display = "none";
        document.getElementById("forgetPassNewPassErrorMsg").style.display   = "block";
        document.getElementById("forgetPassNewPassLoadingMsg").style.display = "none";
        document.getElementById("forgetPassNewPassErrorMsg").textContent="Fields cannot be empty.";
        return;
    }else if(p!==c){
        document.getElementById("forgetPassNewPassSuccessMsg").style.display = "none";
        document.getElementById("forgetPassNewPassErrorMsg").style.display   = "block";
        document.getElementById("forgetPassNewPassLoadingMsg").style.display = "none";
        document.getElementById("forgetPassNewPassErrorMsg").textContent="Password and Confirm Password must be the same.";
        return;
    }
    initiateResetPassword(p);
}

const initiateResetPassword = async (p)=>{
    document.getElementById("forgetPassNewPassSuccessMsg").style.display = "none";
    document.getElementById("forgetPassNewPassErrorMsg").style.display   = "none";
    document.getElementById("forgetPassNewPassLoadingMsg").style.display = "block";

    try{
        const response = await axios.post('/auth/forget-password/reset-password',
        {
            "email": email,
            "password": p,
        },{
            headers:{
                "Content-Type": "application/json"
            }
        });
        if(response.status===200 && response.data.status===true){
            document.getElementById("forgetPassNewPassSuccessMsg").style.display = "block";
            document.getElementById("forgetPassNewPassErrorMsg").style.display   = "none";
            document.getElementById("forgetPassNewPassLoadingMsg").style.display = "none";
            document.getElementById("forgetPassNewPassSuccessMsg").textContent   = response.data.msg;
            setTimeout(()=>{
                window.location.replace("/login");
            }, 1800);
        }else if(response.status===200 && response.data.status===false){
            document.getElementById("forgetPassNewPassSuccessMsg").style.display = "none";
            document.getElementById("forgetPassNewPassErrorMsg").style.display   = "block";
            document.getElementById("forgetPassNewPassLoadingMsg").style.display = "none";
            document.getElementById("forgetPassNewPassErrorMsg").textContent   = response.data.msg;
        }
    }catch(exception){
        console.log(exception);
    }
};

/* RESEND */
function resendOTP(){

}

/* SHOW PASS */
function togglePass(id){
let input=document.getElementById(id)
input.type = input.type === "password" ? "text" : "password"
}

/* MESSAGE */
function show(id,text){
let el=document.getElementById(id)
el.innerText=text
el.style.display="block"
setTimeout(()=>el.style.display="none",3000)
}

</script>

</body>
</html>
