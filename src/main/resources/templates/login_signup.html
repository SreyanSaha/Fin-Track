<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>FinTrack • Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
          --primary: #6750A4;
          --on-primary: #FFFFFF;
          --background: #F4EFFA;
          --surface: #FFFFFF;
          --error: #B3261E;
          --outline: #CAC4D0;
          --text-primary: #1C1B1F;
          --text-secondary: #49454F;
          --shadow: rgba(0, 0, 0, 0.12);
        }

        * {
          box-sizing: border-box;
          font-family: "Roboto", sans-serif;
        }

        body {
          margin: 0;
          min-height: 100vh;
          background: linear-gradient(135deg, #EADDFF, #F6EDFF);
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 16px;
        }

        .app-container {
          width: 100%;
          max-width: 420px;
          background: var(--surface);
          border-radius: 28px;
          box-shadow: 0 10px 30px var(--shadow);
          padding: 32px 24px;
          animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(12px); }
          to { opacity: 1; transform: translateY(0); }
        }

        .app-title {
          text-align: center;
          margin-bottom: 24px;
        }

        .app-title h1 {
          margin: 0;
          font-size: 28px;
          font-weight: 700;
          color: var(--primary);
        }

        .tabs {
          display: flex;
          margin-bottom: 24px;
          background: var(--background);
          border-radius: 14px;
          overflow: hidden;
        }

        .tab {
          flex: 1;
          text-align: center;
          padding: 12px;
          font-weight: 500;
          cursor: pointer;
          color: var(--text-secondary);
        }

        .tab.active {
          background: var(--primary);
          color: var(--on-primary);
        }

        form { display: none; }
        form.active { display: block; }

        .field {
          position: relative;
          margin-bottom: 20px;
        }

        .field input {
          width: 100%;
          padding: 16px 12px;
          border-radius: 12px;
          border: 1px solid var(--outline);
          font-size: 16px;
          outline: none;
        }

        .field label {
          position: absolute;
          left: 12px;
          top: 50%;
          transform: translateY(-50%);
          background: var(--surface);
          padding: 0 6px;
          font-size: 14px;
          color: var(--text-secondary);
          transition: 0.2s;
        }

        .field input:focus + label,
        .field input:not(:placeholder-shown) + label {
          top: -6px;
          font-size: 12px;
          color: var(--primary);
        }

        .btn {
          width: 100%;
          padding: 14px;
          border-radius: 14px;
          border: none;
          background: var(--primary);
          color: var(--on-primary);
          font-size: 16px;
          cursor: pointer;
        }

        .otp-section {
          display: none;
          margin-top: 16px;
          animation: fadeIn 0.4s ease;
        }

        .timer {
          text-align: center;
          font-size: 14px;
          color: var(--text-secondary);
          margin-bottom: 12px;
          width: 100%;
        }

        .alert {
        padding: 8px 12px;
        border-radius: 4px;
        margin: 8px 0;
        font-family: Arial, sans-serif;
        font-size: 14px;
        width: fit-content;
    }
    .response-box {
        width: 100%;
        margin-top: 15px;
    }

    .msg {
        padding: 10px 15px;
        border-radius: 6px;
        font-size: 14px;
        display: none;    /* Hidden by default */
        animation: fadeIn 0.4s ease;
    }

    /* SUCCESS MESSAGE */
    .success {
        background: #d4f8d4;
        color: #166f16;
        border-left: 4px solid #1ea21e;
    }

    /* ERROR MESSAGE */
    .error {
        background: #ffe0e0;
        color: #a10000;
        border-left: 4px solid #d10000;
    }

    .loading {
        background: #fff3cd;              /* light yellow background */
        color: #856404;                   /* dark yellow-brown text */
        border-left: 4px solid #ff7a00;   /* orange theme border */
        padding: 10px 15px;
        border-radius: 6px;
        font-size: 14px;
        display: none;                    /* hidden until needed */
    }
    .hidden {
        display: none;
    }
    .switch {
        margin-top: 18px;
        text-align: center;
           color: #6750A4;
    }
    .switch span {
        color: black;
        cursor: pointer;
    }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-title">
        <h1>FinTrack</h1>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">Login</div>
        <div class="tab" onclick="switchTab('signup')">Sign Up</div>
    </div>

    <!-- Login -->
    <form id="loginForm" class="active">
        <div class="response-box">
            <p id="loginSuccessMsg" class="msg success"></p>
            <p id="loginErrorMsg" class="msg error"></p>
            <p id="loginLoadingMsg" class="msg loading">Processing request…</p>
        </div>
        <div class="field">
            <input type="text" id="loginUser" placeholder=" " />
            <label>Username</label>
        </div>

        <div class="field">
            <input type="password" id="loginPass" placeholder=" " />
            <label>Password</label>
        </div>

        <button class="btn" onclick="checkLoginInputs(event)">Login</button>
    </form>

    <!-- Signup -->
    <form id="signupForm">
        <div class="response-box">
            <p id="signupSuccessMsg" class="msg success"></p>
            <p id="signupErrorMsg" class="msg error"></p>
            <p id="loadingMsg" class="msg loading">Processing request…</p>
        </div>
        <div class="field">
            <input type="email" id="signupEmail" placeholder=" " />
            <label>Email</label>
        </div>

        <div class="field">
            <input type="password" id="signupPass" placeholder=" " />
            <label>Password</label>
        </div>

        <div class="field">
            <input type="password" id="signupConfirm" placeholder=" " />
            <label>Confirm Password</label>
        </div>

        <button class="btn" type="button" onclick="checkSignupInputs(event)">Create Account</button>

        <!-- OTP Section -->
        <div class="otp-section" id="otpSection">
            <p style="text-align:center;color:black;">We sent a 6-digit OTP to your email</p>
            <div class="timer" id="timer">Time left: 60s</div>
            <div class="response-box">
                <p id="signupSuccessMsgOtp" class="msg success"></p>
                <p id="signupErrorMsgOtp" class="msg error"></p>
                <p id="loadingMsgOtp" class="msg loading">Processing request…</p>
            </div>
            <div class="field">
                <input type="text" maxlength="6" id="otpInput" placeholder=" " />
                <label>Enter OTP</label>
            </div>

            <button class="btn" onclick="initiateSignup(event)">Verify OTP</button>
            <div class="switch">
                Didn't receive OTP? <span onclick="resendOTP()">Resend</span>
            </div>
        </div>
    </form>
</div>

<script>
    const checkLoginInputs = ()=>{
        event.preventDefault();

        const success = document.getElementById("loginSuccessMsg");
        const error = document.getElementById("loginErrorMsg");

        if(document.getElementById("loginUser").value.trim()==="" &&
          document.getElementById("loginPass").value.trim()===""){
            success.style.display = "none";
            error.style.display = "block";
            error.textContent = "Fields cannot be empty.";
        }else
            initiateLogin();
    }

    const initiateLogin = async ()=>{
        document.getElementById("loginSuccessMsg").style.display="none";
        document.getElementById("loginErrorMsg").style.display="none";
        document.getElementById("loginLoadingMsg").style.display = "block";
        try{
            const response = await axios.post('http://localhost:8080/auth/login',
            {
                "username": document.getElementById("loginUser").value,
                "userPassword": document.getElementById("loginPass").value,
            },{
                withCredentials: true,
                headers:{
                "Content-Type": "application/json"
                }
            });
            if(response.status===200 || response.data.status===true){
                document.getElementById("loginErrorMsg").style.display="none";
                document.getElementById("loginLoadingMsg").style.display = "none";
                document.getElementById("loginSuccessMsg").style.display="block";
                document.getElementById("loginSuccessMsg").textContent=response.data.msg;
                localStorage.setItem(
                    "user",
                    JSON.stringify(
                        {
                            username: response.data.object.username,
                            token: response.data.object.token
                        }
                    )
                );
                setTimeout(() => {
                    window.location.replace("http://localhost:8080/index");
                }, 1800);
            }
        }catch(exception){
            if(exception.status===401 || response.data.status===false){
                document.getElementById("loginLoadingMsg").style.display = "none";
                document.getElementById("loginSuccessMsg").style.display="none";
                document.getElementById("loginErrorMsg").style.display="block";
                document.getElementById("loginErrorMsg").textContent=exception.response.data.msg;
            }
            console.log(exception);
        }
    }

    const checkSignupInputs = ()=>{
        const success = document.getElementById("signupSuccessMsg");
        const error = document.getElementById("signupErrorMsg");

        if(document.getElementById("signupEmail").value.trim()==="" ||
          (document.getElementById("signupPass").value.trim()==="" &&
           document.getElementById("signupConfirm").value.trim()==="")){

            success.style.display = "none";
            error.style.display = "block";
            error.textContent = "Fields cannot be empty.";
        }
        else if(document.getElementById("signupPass").value!==document.getElementById("signupConfirm").value){
        success.style.display = "none";
        error.style.display = "block";
        error.textContent = "Password and Confirm Password must be the same.";
        }else
            getOtpMail();
    }

    const getOtpMail = async ()=>{
        document.getElementById("signupSuccessMsg").style.display="none";
        document.getElementById("signupErrorMsg").style.display="none";
        document.getElementById("loadingMsg").style.display = "block";

        document.getElementById("signupSuccessMsgOtp").style.display="none";
        document.getElementById("signupErrorMsgOtp").style.display="none";
        document.getElementById("loadingMsgOtp").style.display = "none";
        try{
            const response = await axios.post('http://localhost:8080/auth/signup',
            {
                "userEmail": document.getElementById("signupEmail").value,
                "userPassword": document.getElementById("signupPass").value
            },{
                headers:{
                    "Content-Type": "application/json"
                }
            });
            if(response.status===200 && response.data.status===true){
                document.getElementById("loadingMsg").style.display = "none";
                document.getElementById("signupErrorMsg").style.display="none";
                document.getElementById("signupSuccessMsg").style.display="block";

                document.getElementById("signupSuccessMsg").textContent=response.data.msg;
                startOTP();
            }else if(response.status===200 && response.data.status===false){
                document.getElementById("loadingMsg").style.display = "none";
                document.getElementById("signupSuccessMsg").style.display="none";
                document.getElementById("signupErrorMsg").style.display="block";
                document.getElementById("signupErrorMsg").textContent=response.data.msg;
            }
        }catch(exception){
            console.log(exception);
        }
    };

    const initiateSignup = async (event)=>{
        event.preventDefault();
        document.getElementById("signupSuccessMsgOtp").style.display="none";
        document.getElementById("signupErrorMsgOtp").style.display="none";
        document.getElementById("loadingMsgOtp").style.display = "block";
        try{
            const response = await axios.post('http://localhost:8080/auth/signup/otp',
            {
                "otp": document.getElementById("otpInput").value,
                "email": document.getElementById("signupEmail").value,
            },{
                headers:{
                "Content-Type": "application/json"
                }
            });
            if(response.status===201 && response.data.status===true){
                document.getElementById("signupErrorMsgOtp").style.display="none";
                document.getElementById("loadingMsgOtp").style.display = "none";
                document.getElementById("signupSuccessMsgOtp").style.display="block";
                document.getElementById("signupSuccessMsgOtp").textContent=response.data.msg;
                setTimeout(() => {
                    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
                    document.querySelectorAll("form").forEach(f => f.classList.remove("active"));
                    document.getElementById("otpSection").style.display = "none";
                    document.querySelectorAll(".tab")[0].classList.add("active");

                    document.getElementById("loginSuccessMsg").style.display="block";
                    document.getElementById("loginSuccessMsg").textContent=response.data.msg;

                    loginForm.classList.add("active");
                }, 3000);
            }else if(response.status===200 && response.data.status===false){
                document.getElementById("signupSuccessMsgOtp").style.display="none";
                document.getElementById("loadingMsgOtp").style.display = "none";
                document.getElementById("signupErrorMsgOtp").style.display="block";
                document.getElementById("signupErrorMsgOtp").textContent=response.data.msg;
            }
        }catch(exception){
            console.log(exception);
        }
    }


      function switchTab(type) {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll("form").forEach(f => f.classList.remove("active"));

        if (type === "login") {
          document.querySelectorAll(".tab")[0].classList.add("active");
          loginForm.classList.add("active");
        } else {
          document.querySelectorAll(".tab")[1].classList.add("active");
          signupForm.classList.add("active");
        }
      }

      let timerInterval;

      function startOTP() {
        document.getElementById("otpSection").style.display = "block";

        let time = 60;
        const timerEl = document.getElementById("timer");
        clearInterval(timerInterval);

        timerInterval = setInterval(() => {
          let seconds = time--;
          timerEl.textContent = "Time left: "+seconds+"s";

          if (time < 0) {
            clearInterval(timerInterval);
            timerEl.textContent = "OTP Expired";
          }
        }, 1000);
      }

      function resendOTP() {
          event.preventDefault();
            alert("OTP Resent!");
            getOtpMail();
        }
</script>

</body>
</html>
